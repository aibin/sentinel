{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport"
              content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <title>
            {% block title %}
                Login | {{ request.organization.name }}
            {% endblock title %}
        </title>
        <link rel="stylesheet" href="{% static 'core/css/tabler.min.css' %}" />
        {% block extra_css %}
        {% endblock extra_css %}
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
              rel="stylesheet">
        <style>
      :root {
        --tblr-font-sans-serif: "Outfit", sans-serif;
        --tblr-dropdown-font-size: 1.0rem;
        --tblr-btn-font-size: 1.0rem;
        --tblr-body-font-size: 1.0rem;
        --tblr-body-font-weight: 400;
      }
        </style>
        {% block extra_head %}
        {% endblock extra_head %}
    </head>
    <body>
        <div class="page page-center" hx-history-elt>
            <div class="page-wrapper">
                <!-- Page header -->
                <div class="container container-tight py-4">
                    {% block layout %}
                    {% endblock layout %}
                </div>
            </div>
        </div>
        <script src="{% static 'core/js/tabler.min.js'%}"></script>
        <script src="https://unpkg.com/hyperscript.org@0.9.13"></script>
        {% block extra_js %}
        {% endblock extra_js %}
    </body>
</html>
